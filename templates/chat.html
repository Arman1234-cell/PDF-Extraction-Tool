<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind AI | Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Dark Mode (Default) */
            --background: hsl(240, 10%, 3.9%);
            --foreground: hsl(0, 0%, 98%);
            --sidebar-bg: hsl(240, 10%, 6%);
            --border: hsl(240, 3.7%, 15.9%);
            --primary: hsl(263, 70%, 50%);
            --radius: 0.5rem;
            --card-bg: rgba(255, 255, 255, 0.03);
            /* Gradient for pills */
            --pill-gradient: linear-gradient(135deg, hsl(263, 70%, 50%), hsl(280, 70%, 40%));
        }

        body.light-mode {
            --background: hsl(0, 0%, 100%);
            --foreground: hsl(240, 10%, 3.9%);
            --sidebar-bg: hsl(240, 5%, 96%);
            --border: hsl(240, 5%, 84%);
            --card-bg: rgba(0, 0, 0, 0.05);
            --pill-gradient: linear-gradient(135deg, hsl(263, 70%, 60%), hsl(280, 70%, 50%));
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--background); 
            color: var(--foreground); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Status Overlay */
        #indexing-overlay {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: hsla(240, 10%, 6%, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid var(--primary);
            padding: 1.5rem 2.5rem;
            border-radius: 1rem;
            z-index: 2000;
            text-align: center;
        }

        .indexing-text {
            font-weight: 600;
            background: linear-gradient(90deg, #fff, var(--primary), #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 2s linear infinite;
        }

        @keyframes shine { to { background-position: 200% center; } }

        .spinner {
            width: 30px; height: 30px;
            border: 3px solid hsla(263, 70%, 50%, 0.2);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            margin: 0 auto 1rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* UI Styles */
        .top-nav { height: 4rem; display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; background: var(--background); border-bottom: 1px solid var(--border); z-index: 1000; }
        .nav-controls { display: flex; align-items: center; gap: 10px; }
        .theme-btn { background: none; border: 1px solid var(--border); color: var(--foreground); padding: 0.4rem 0.8rem; border-radius: 2rem; cursor: pointer; }

        .app-wrapper { display: flex; flex: 1; height: calc(100vh - 4rem); position: relative; }
        .sidebar { width: 300px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem; gap: 1.5rem; transition: 0.3s; }
        
        @media (max-width: 768px) { 
            .sidebar { position: absolute; left: -100%; top: 0; bottom: 0; z-index: 999; width: 280px; } 
            .sidebar.open { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.8); } 
        }

        .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--background); position: relative; overflow: hidden;}
        #chat-window { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; padding-bottom: 2rem; }
        
        .msg { max-width: 85%; padding: 0.8rem 1.2rem; border-radius: 1rem; font-size: 0.95rem; line-height: 1.5; }
        .bot-msg { background: var(--sidebar-bg); border: 1px solid var(--border); align-self: flex-start; }
        .user-msg { background: var(--primary); color: white; align-self: flex-end; }
        
        /* 📱 Footer & Mobile Search Fix */
        footer { padding: 1rem; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.8rem; background: var(--background); width: 100%;}
        .input-row { display: flex; align-items: center; gap: 0.5rem; width: 100%; }
        .input-container { flex: 1; display: flex; align-items: center; background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 2rem; padding: 0.2rem 0.5rem; min-width: 0; /* Important for flex child */ }
        footer input { flex: 1; background: transparent; border: none; color: var(--foreground); padding: 0.6rem 0.8rem; outline: none; font-size: 16px; min-width: 0; }
        
        .send-btn { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 2rem; cursor: pointer; font-weight: 600; flex-shrink: 0; }

        .mobile-plus-btn { display: none; width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: white; border: none; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; flex-shrink: 0; }
        
        /* 📱 GRADIENT TOPIC PILLS */
        .sticky-topics { 
            display: flex; 
            padding: 2px 0; 
            overflow-x: auto; 
            white-space: nowrap; 
            gap: 8px; 
            scrollbar-width: none; 
        }
        .sticky-topics::-webkit-scrollbar { display: none; }
        
        .topic-pill {
            display: inline-block;
            padding: 6px 14px;
            background: var(--pill-gradient);
            border: none;
            border-radius: 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            color: white;
            transition: transform 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .topic-pill:hover { transform: translateY(-1px); opacity: 0.9; }

        @media (max-width: 768px) { 
            .mobile-plus-btn { display: flex; } 
            .input-row { gap: 8px; }
            .send-btn { padding: 0.6rem 1rem; }
        }

        .history-item { padding: 0.75rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 0.5rem; font-size: 0.85rem; }
    </style>
</head>
<body class="dark-mode">

    <div id="indexing-overlay">
        <div class="spinner"></div>
        <div class="indexing-text">Indexing Knowledge Base...</div>
    </div>

    <nav class="top-nav">
        <div class="hamburger" onclick="toggleSidebar()" style="cursor: pointer; font-size: 1.5rem;">☰</div>
        <div style="font-weight: 700;">DocuMind AI</div>
        <div class="nav-controls">
            <button onclick="toggleTheme()" class="theme-btn"><span id="theme-icon">☀️</span></button>
            <a href="{{ url_for('index') }}" style="text-decoration: none; color: var(--foreground); font-size: 0.9rem; padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: 2rem;">🏠 Home</a>
        </div>
    </nav>

    <div class="app-wrapper">
        <aside id="sidebar" class="sidebar">
            <h4>Your Documents</h4>
            <div class="upload-section">
                <input type="file" id="pdfInput" accept=".pdf" style="display: none;">
                <label for="pdfInput" style="display: block; padding: 1rem; border: 2px dashed var(--border); border-radius: var(--radius); text-align: center; cursor: pointer; margin-bottom: 1rem;">
                    <span id="fileNameDisplay">➕ New PDF</span>
                </label>
                <button onclick="uploadPDF()" id="uploadBtn" style="width: 100%; background: var(--primary); color: white; border: none; padding: 0.7rem; border-radius: var(--radius); cursor: pointer; font-weight: 600;">Upload & Index</button>
            </div>
            <div id="file-list-container">
                <p style="font-size: 0.7rem; opacity: 0.5; text-transform: uppercase; margin-bottom: 8px;">Recent Files</p>
                <div id="file-list"></div>
            </div>
            <div id="tag-box-sidebar">
                <p style="font-size: 0.7rem; opacity: 0.5; text-transform: uppercase; margin-bottom: 8px;">Topics</p>
                <div id="sidebar-tags"></div>
            </div>
        </aside>

        <main class="chat-main">
            <div id="chat-window" onclick="closeSidebarOnMobile()">
                <div class="msg bot-msg">Welcome. Upload a PDF to start extracting knowledge.</div>
            </div>
            
            <footer>
                <div id="mobile-topics" class="sticky-topics"></div>
                
                <div class="input-row">
                    <div class="input-container">
                        <button class="mobile-plus-btn" onclick="triggerFileUpload()">+</button>
                        <input type="text" id="userQuery" placeholder="Ask a question..." onkeypress="if(event.key === 'Enter') askQuestion()">
                    </div>
                    <button class="send-btn" onclick="askQuestion()">Send</button>
                </div>
            </footer>
        </main>
    </div>

    <script>
        let uploadedFiles = [];

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            icon.innerText = isLight ? '🌙' : '☀️';
            localStorage.setItem('documind-theme', isLight ? 'light' : 'dark');
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function closeSidebarOnMobile() { if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open'); }
        
        function triggerFileUpload() {
            const input = document.getElementById('pdfInput');
            input.onchange = async function() {
                if(this.files[0]) {
                    document.getElementById('fileNameDisplay').innerText = this.files[0].name;
                    await uploadPDF(); 
                }
            };
            input.click();
        }

        async function uploadPDF() {
            const fileInput = document.getElementById('pdfInput');
            const overlay = document.getElementById('indexing-overlay');
            if (!fileInput.files[0]) return;

            const fileName = fileInput.files[0].name;
            overlay.style.display = 'block';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
                
                if(!uploadedFiles.includes(fileName)) {
                    uploadedFiles.push(fileName);
                    const fileList = document.getElementById('file-list');
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.innerHTML = `📄 ${fileName}`;
                    fileList.prepend(item);
                }

                updateTopicsUI(data.tags);
                addMessage("bot", `Indexed successfully: ${fileName}`);
            } catch (err) {
                addMessage("bot", "Error during indexing.");
            } finally {
                overlay.style.display = 'none';
                document.getElementById('fileNameDisplay').innerText = "➕ New PDF";
                fileInput.value = "";
                closeSidebarOnMobile();
            }
        }

        function updateTopicsUI(tags) {
            const sidebarTags = document.getElementById('sidebar-tags');
            const mobileTopics = document.getElementById('mobile-topics');
            
            sidebarTags.innerHTML = '';
            mobileTopics.innerHTML = ''; 

            tags.forEach(tag => {
                // Sidebar Version (Standard)
                const sSpan = document.createElement('span');
                sSpan.style = "display: inline-block; padding: 4px 12px; background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 1rem; margin: 4px; font-size: 0.8rem; cursor: pointer; color: var(--foreground);";
                sSpan.innerText = tag;
                sSpan.onclick = () => { document.getElementById('userQuery').value = `Tell me about ${tag}`; };
                sidebarTags.appendChild(sSpan);

                // Mobile/Chat Version (Gradient Pill)
                const mSpan = document.createElement('span');
                mSpan.className = 'topic-pill';
                mSpan.innerText = tag;
                mSpan.onclick = () => { 
                    document.getElementById('userQuery').value = `Tell me about ${tag}`; 
                    askQuestion(); // Optional: trigger chat immediately on click
                };
                mobileTopics.appendChild(mSpan);
            });
        }

        async function askQuestion() {
            const input = document.getElementById('userQuery');
            const query = input.value.trim();
            if (!query) return;
            addMessage("user", query);
            input.value = "";
            const response = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: query }) });
            const data = await response.json();
            addMessage("bot", data.response);
        }

        function addMessage(sender, text) {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `msg ${sender}-msg`;
            div.innerText = text;
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('documind-theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('theme-icon').innerText = '🌙';
            }
        };
    </script>
</body>
</html>
